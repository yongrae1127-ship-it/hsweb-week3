<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3주차 예제 2 · 의미 없이 묶을 때</title>
</head>
<body>
  <!--
  3주차 예제 2 — 의미 없이 묶을 때
  -->
  <!-- div — 블록(줄 전체를 차지) -->
  <div class="card">
    <h3>제목</h3>
    <p>내용</p>
  </div>

  <!-- span — 인라인(글자 흐름 안에) -->
  <p>가격은 <span class="price">15,000원</span> 입니다.</p>
</body>
</html>
