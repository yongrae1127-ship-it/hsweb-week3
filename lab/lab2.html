  문제: 접근성이 나쁜 아래 코드를 고치세요. 문제는 4개입니다 — img에 alt가 없고, label이 연결되지 않았고, 누르는 것이 div이며, 제목 계층이 h1에서 h3으로 건너뜁니다.
  힌트: div onclick 대신 button을 쓰면 Tab으로 잡히고 Enter로도 눌립니다. 그것만으로 키보드 사용자에게 열립니다.
  꼭 들어가야 하는 것: alt=  <label  for="mail"  <button  <h2
  -->
  <h1>문의하기</h1>
  <h3>연락처를 남겨 주세요</h3>
  <img src="https://picsum.photos/200/100">
  <p>이메일</p>
  <input type="email" id="mail">
  <div onclick="send()">보내기</div>
